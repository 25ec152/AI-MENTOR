{% extends "base.html" %}
{% block title %}Register — AI Mentor{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="auth-tagline">Join your AI Innovation workspace</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label for="username">
          <i class="fa-solid fa-user"></i> Username
        </label>
        <input type="text" id="username" name="username" required autofocus
               placeholder="yourname" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="email">
          <i class="fa-solid fa-envelope"></i> Email
        </label>
        <input type="email" id="email" name="email" required
               placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fa-solid fa-lock"></i> Password
        </label>
        <input type="password" id="password" name="password" required
               minlength="8" placeholder="Min 8 characters"
               autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;padding:13px;">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
